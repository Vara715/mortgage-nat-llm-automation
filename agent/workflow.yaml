# NAT workflow config for the Mortgage Policy Q&A agent.
# Run with:
#   nat run --config_file agent/workflow.yaml --input "your question"
# Serve with:
#   nat serve --config_file agent/workflow.yaml
# Evaluate with:
#   nat eval --config_file agent/workflow.yaml --dataset eval/eval_dataset.jsonl

functions:
  policy_retriever:
    _type: policy_retriever
    data_path: data/clean_mortgage_data.jsonl
    top_k: 3

  emi_calculator:
    _type: emi_calculator

  eligibility_advisor:
    _type: eligibility_advisor
    foir_limit_percent: 50.0
    max_tenure_years: 30.0

  prepayment_advisor:
    _type: prepayment_advisor

llms:
  nim_llm:
    _type: nim
    model_name: meta/muse-glimmer-30b
    temperature: 0.0
    max_tokens: 2048
    chat_template_kwargs:
      enable_thinking: false

  judge_llm:
    _type: nim
    model_name: meta/muse-glimmer-30b
    temperature: 0.0
    max_tokens: 2048
    chat_template_kwargs:
      enable_thinking: false

workflow:
  _type: react_agent
  tool_names: [policy_retriever, emi_calculator, eligibility_advisor, prepayment_advisor]
  llm_name: nim_llm
  verbose: true
  parse_agent_response_max_retries: 3

eval:
  general:
    output_dir: ./eval_results
    dataset:
      _type: json
      file_path: eval/eval_dataset.json
  evaluators:
    accuracy:
      _type: tunable_rag_evaluator
      llm_name: judge_llm
      default_scoring: true
      judge_llm_prompt: >
        You are an intelligent evaluator that scores how well a generated answer
        matches the expected answer for a mortgage policy question. Consider
        coverage of key facts (numbers, percentages, conditions) and correctness.
        Penalize hallucinated details not supported by the expected answer.
