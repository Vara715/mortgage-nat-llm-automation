# NAT workflow config for TCS Mortgage Loan Compliance System.
# Run with:
#   nat run --config_file agent/workflow.yaml --input "Audit the compliance of data/real_docs/sample_loan_agreements/non_compliant_home_loan_agreement.txt"
# Serve with:
#   nat serve --config_file agent/workflow.yaml
# Evaluate with:
#   nat eval --config_file agent/workflow.yaml --dataset eval/eval_dataset.json

functions:
  policy_retriever:
    _type: policy_retriever
    top_k: 3

  compliance_checker:
    _type: compliance_checker

  loan_agreement_analyzer:
    _type: loan_agreement_analyzer

  emi_calculator:
    _type: emi_calculator

  eligibility_advisor:
    _type: eligibility_advisor
    foir_limit_percent: 50.0
    max_tenure_years: 30.0

  prepayment_advisor:
    _type: prepayment_advisor

llms:
  nim_llm:
    _type: nim
    model_name: meta/muse-glimmer-30b
    temperature: 0.0
    max_tokens: 2048
    chat_template_kwargs:
      enable_thinking: false

  judge_llm:
    _type: nim
    model_name: meta/muse-glimmer-30b
    temperature: 0.0
    max_tokens: 2048
    chat_template_kwargs:
      enable_thinking: false

workflow:
  _type: react_agent
  tool_names:
    - policy_retriever
    - compliance_checker
    - loan_agreement_analyzer
    - emi_calculator
    - eligibility_advisor
    - prepayment_advisor
  llm_name: nim_llm
  verbose: true
  parse_agent_response_max_retries: 3

eval:
  general:
    output_dir: ./eval_results
    dataset:
      _type: json
      file_path: eval/eval_dataset.json
  evaluators:
    accuracy:
      _type: tunable_rag_evaluator
      llm_name: judge_llm
      default_scoring: true
      judge_llm_prompt: >
        You are an intelligent evaluator that scores how well a generated answer
        matches the expected answer for a mortgage policy and compliance question.
        Consider coverage of key regulatory citations (RBI circulars), numbers,
        percentages, and compliance violation rationale. Penalize hallucinated details.
