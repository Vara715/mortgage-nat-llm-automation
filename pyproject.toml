[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mortgage-nat-project"
version = "0.2.0"
description = "TCS Mortgage Loan Compliance System — AI Efficient Regulatory Compliance & Analysis"
requires-python = ">=3.11"

# NAT auto-discovers custom tools via the nat.plugins entry point
[project.entry-points.'nat.plugins']
mortgage_nat_project = "agent.tools"

[tool.setuptools]
packages = ["agent", "extraction", "compliance", "kb"]
